<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SecureID - Mobile Verification</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="verify-page">

    <div class="verify-container">

        <div class="verify-card">

            <!-- Back Button -->
            <a
                href="login-verify.html"
                class="back-button"
            >
                ←
            </a>


            <!-- Mobile Icon -->
            <div class="icon-circle">
                📱
            </div>


            <!-- Heading -->
            <h1>
                Verify your mobile
            </h1>

            <p class="subtitle">
                Enter the 6-digit code sent to your mobile number
            </p>


            <!-- OTP Form -->
            <form id="login-mobile-otp-form">

                <div class="otp-container">

                    <input
                        type="text"
                        maxlength="1"
                        class="otp-input"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        class="otp-input"
                        inputmode="numeric"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        class="otp-input"
                        inputmode="numeric"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        class="otp-input"
                        inputmode="numeric"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        class="otp-input"
                        inputmode="numeric"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        class="otp-input"
                        inputmode="numeric"
                    >

                </div>


                <!-- Message -->
                <p
                    id="otp-message"
                    class="otp-message"
                ></p>


                <!-- Verify Button -->
                <button
                    type="submit"
                    class="primary-button"
                >
                    Verify Mobile
                </button>

            </form>


            <!-- Resend OTP -->
            <p class="resend-text">

                Didn't receive the code?

                <button
                    type="button"
                    id="resend-login-mobile-otp"
                    class="link-button"
                >
                    Resend OTP
                </button>

            </p>

        </div>

    </div>


    <script src="login-mobile-otp.js"></script>

</body>

</html>
